spring.application.name=apm-server

# 允许同一局域网内的手机访问本机启动的服务；手机访问“开发机局域网 IP:端口”。
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# multipart 先由 Web 容器限制总请求和单 part，再由报告控制器限制 metadata/report/HPROF 业务边界。
spring.servlet.multipart.max-file-size=${APM_MULTIPART_MAX_FILE_SIZE:32MB}
spring.servlet.multipart.max-request-size=${APM_MULTIPART_MAX_REQUEST_SIZE:34MB}
spring.servlet.multipart.resolve-lazily=true

# 默认使用 ClickHouse 持久化事件；如需无外部依赖的临时联调，可通过 APM_STORAGE_MODE=memory 覆盖。
# 首次使用前按顺序执行 db/clickhouse/001_crash_schema.sql、002_jank_schema.sql、003_jank_sampling_quality.sql、004_application_identity_schema.sql、005_memory_metrics.sql、006_memory_leak_reports.sql 和 007_event_process_identity.sql。
apm.ingest.enabled=true
apm.app-key.encryption-key=${APM_APP_KEY_ENCRYPTION_KEY:}
apm.ingest.supported-schema-version=2
apm.ingest.max-request-bytes=1048576
apm.ingest.max-decompressed-bytes=4194304
apm.ingest.max-event-bytes=262144
apm.ingest.max-message-length=4096
apm.ingest.max-stack-frames=200
apm.ingest.max-throwable-chain=16
apm.ingest.max-past-days=7
apm.ingest.max-future-skew-minutes=15
apm.ingest.device-hash-salt=${APM_DEVICE_HASH_SALT:local-development-salt}
apm.ingest.jank-enabled=${APM_JANK_ENABLED:true}
apm.ingest.frame-metrics-enabled=${APM_FRAME_METRICS_ENABLED:true}
apm.ingest.suspension-metrics-enabled=${APM_SUSPENSION_METRICS_ENABLED:true}
apm.ingest.supported-jank-algorithm-versions=${APM_JANK_ALGORITHMS:jank-v1}
apm.ingest.supported-fps-algorithm-versions=${APM_FPS_ALGORITHMS:fps-v1}
apm.ingest.supported-suspension-algorithm-versions=${APM_SUSPENSION_ALGORITHMS:suspension-v1}
apm.ingest.max-jank-samples=${APM_MAX_JANK_SAMPLES:2000}
apm.ingest.max-jank-stack-dictionary=${APM_MAX_JANK_STACK_DICTIONARY:2000}
apm.ingest.max-jank-stack-depth=${APM_MAX_JANK_STACK_DEPTH:128}
apm.ingest.max-jank-total-frames=${APM_MAX_JANK_TOTAL_FRAMES:10000}
apm.ingest.max-scene-length=${APM_MAX_SCENE_LENGTH:128}
apm.ingest.max-jank-message-duration-ns=${APM_MAX_JANK_MESSAGE_DURATION_NS:60000000000}
apm.ingest.max-jank-threshold-ns=${APM_MAX_JANK_THRESHOLD_NS:60000000000}
apm.ingest.max-sampling-interval-ns=${APM_MAX_SAMPLING_INTERVAL_NS:5000000000}
apm.ingest.max-jank-detail-bytes=${APM_MAX_JANK_DETAIL_BYTES:524288}
apm.ingest.max-frame-histogram-buckets=${APM_MAX_FRAME_HISTOGRAM_BUCKETS:64}
apm.ingest.suspension-threshold-ms=${APM_SUSPENSION_THRESHOLD_MS:200}
apm.ingest.max-process-name-length=${APM_MAX_PROCESS_NAME_LENGTH:256}
apm.ingest.max-memory-metric-bytes=${APM_MAX_MEMORY_METRIC_BYTES:9007199254740991}

apm.memory-leak-report.max-metadata-bytes=${APM_MEMORY_REPORT_MAX_METADATA_BYTES:2097152}
apm.memory-leak-report.max-report-bytes=${APM_MEMORY_REPORT_MAX_REPORT_BYTES:2097152}
apm.memory-leak-report.max-attachment-bytes=${APM_MEMORY_REPORT_MAX_ATTACHMENT_BYTES:268435456}
apm.memory-leak-report.max-request-bytes=${APM_MEMORY_REPORT_MAX_REQUEST_BYTES:272629760}
apm.memory-leak-report.max-depth=${APM_MEMORY_REPORT_MAX_DEPTH:32}
apm.memory-leak-report.max-array-items=${APM_MEMORY_REPORT_MAX_ARRAY_ITEMS:1000}
apm.memory-leak-report.max-path-nodes=${APM_MEMORY_REPORT_MAX_PATH_NODES:256}
apm.memory-leak-report.max-string-bytes=${APM_MEMORY_REPORT_MAX_STRING_BYTES:16384}
apm.memory-leak-report.retention-days=${APM_MEMORY_REPORT_RETENTION_DAYS:90}
apm.memory-leak-report.attachment-retention-days=${APM_MEMORY_REPORT_ATTACHMENT_RETENTION_DAYS:7}
apm.memory-leak-report.orphan-grace-hours=${APM_MEMORY_REPORT_ORPHAN_GRACE_HOURS:24}
apm.memory-leak-report.artifact-directory=${APM_MEMORY_REPORT_ARTIFACT_DIRECTORY:build/memory-report-artifacts}

apm.stack-parser.max-artifact-bytes=${APM_STACK_PARSER_MAX_ARTIFACT_BYTES:67108864}
apm.stack-parser.max-concurrent-parses=${APM_STACK_PARSER_MAX_CONCURRENT_PARSES:2}
apm.stack-parser.mapping-root=${APM_STACK_PARSER_MAPPING_ROOT:}

# 网页 mapping 文件只保存到受控持久卷，并与 Crash Retrace 共用有界许可。
apm.symbol.max-file-bytes=${APM_SYMBOL_MAX_FILE_BYTES:33554432}
apm.symbol.max-output-bytes=${APM_SYMBOL_MAX_OUTPUT_BYTES:1048576}
apm.symbol.max-concurrent-operations=${APM_SYMBOL_MAX_CONCURRENT_OPERATIONS:2}
apm.symbol.directory=${APM_SYMBOL_DIRECTORY:build/symbols}

apm.query.max-range-days=31
apm.query.default-limit=50
apm.query.max-limit=500
apm.query.default-timeout-ms=2000
apm.query.max-timeout-ms=5000
apm.query.max-rows-to-read=${APM_QUERY_MAX_ROWS_TO_READ:5000000}
apm.query.max-bytes-to-read=${APM_QUERY_MAX_BYTES_TO_READ:536870912}
apm.query.max-memory-usage=${APM_QUERY_MAX_MEMORY_USAGE:268435456}
apm.query.max-response-bytes=${APM_QUERY_MAX_RESPONSE_BYTES:8388608}
apm.agent.limits.token-per-minute=${APM_AGENT_TOKEN_PER_MINUTE:60}
apm.agent.limits.token-concurrent=${APM_AGENT_TOKEN_CONCURRENT:2}
apm.agent.limits.app-per-minute=${APM_AGENT_APP_PER_MINUTE:300}
apm.agent.limits.app-concurrent=${APM_AGENT_APP_CONCURRENT:8}
apm.agent.limits.invalid-per-ip-per-minute=${APM_AGENT_INVALID_PER_IP_PER_MINUTE:30}

# 网页管理域使用 PostgreSQL 持久化用户、应用、成员关系和 Session。
spring.datasource.url=${APM_DATABASE_URL:jdbc:postgresql://localhost:5432/apm}
spring.datasource.username=${APM_DATABASE_USERNAME:apm}
spring.datasource.password=${APM_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${APM_DATABASE_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${APM_FLYWAY_ENABLED:true}
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=${APM_SESSION_TIMEOUT:8h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${APM_SESSION_SAME_SITE:lax}
server.servlet.session.cookie.secure=${APM_SESSION_COOKIE_SECURE:false}

apm.auth.bootstrap-admin-email=${APM_BOOTSTRAP_ADMIN_EMAIL:}
apm.auth.bootstrap-admin-password=${APM_BOOTSTRAP_ADMIN_PASSWORD:}
apm.auth.bootstrap-admin-display-name=${APM_BOOTSTRAP_ADMIN_DISPLAY_NAME:平台管理员}

apm.storage.mode=${APM_STORAGE_MODE:clickhouse}
apm.storage.in-memory-available=${APM_STORAGE_IN_MEMORY_AVAILABLE:false}

apm.clickhouse.enabled=${APM_CLICKHOUSE_ENABLED:true}
apm.clickhouse.url=${CLICKHOUSE_URL:http://localhost:8123}
apm.clickhouse.database=${CLICKHOUSE_DATABASE:apm}
apm.clickhouse.username=${CLICKHOUSE_USERNAME:apm_admin}
apm.clickhouse.password=${CLICKHOUSE_PASSWORD:}
apm.clickhouse.read-only-user=${CLICKHOUSE_READ_ONLY_USER:apm_readonly}

management.endpoints.web.exposure.include=health,info,metrics
apm.agent.query.enabled=${APM_AGENT_QUERY_ENABLED:false}

# 单事件当前代码分析与明确修复默认关闭；模型使用宿主配置。
apm.agent.analysis.enabled=${APM_AGENT_ANALYSIS_ENABLED:false}
