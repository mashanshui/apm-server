# 测试使用内存仓库，避免测试依赖本机 ClickHouse 实例。
apm.storage.mode=memory
apm.storage.in-memory-available=true
apm.clickhouse.enabled=false
apm.ingest.max-past-days=3650
apm.ingest.supported-fps-algorithm-versions=fps-v1,fps-v2
apm.ingest.supported-suspension-algorithm-versions=suspension-v1,suspension-v2
apm.app-key.encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# 单元与 MVC 测试使用内存数据库；Flyway/PostgreSQL 专项测试单独启动 PostgreSQL。
spring.datasource.url=jdbc:h2:mem:apm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
# MVC/H2 测试使用 Servlet 会话；真实 HTTP 专项显式启用 JDBC。
spring.autoconfigure.exclude=org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
apm.auth.bootstrap-admin-email=test@example.com
apm.auth.bootstrap-admin-password=Test-password-123!
apm.auth.bootstrap-admin-display-name=测试管理员

# 单元测试多数不建立分析管理表；维护逻辑由真实 PostgreSQL 测试主动调用。
apm.agent.analysis.maintenance-initial-delay-ms=3600000
