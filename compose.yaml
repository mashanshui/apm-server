services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${APM_DATABASE_NAME:-apm}
      POSTGRES_USER: ${APM_DATABASE_USERNAME:-apm}
      POSTGRES_PASSWORD: ${APM_DATABASE_PASSWORD:-apm-local-only}
    ports:
      - "${APM_DATABASE_PORT:-5432}:5432"
    volumes:
      - apm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  apm-postgres-data:
