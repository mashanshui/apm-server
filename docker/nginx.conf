server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 覆盖内存报告的 260 MiB 和符号表的 32 MiB 请求；具体业务上限仍由后端配置执行。
    client_max_body_size 260m;
    client_body_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Compose 健康检查入口，不对外暴露数据库或 ClickHouse。
    location = /healthz {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard 管理 API 使用同源 Session Cookie 和 CSRF Cookie。
    # MCP 只允许小请求体，Bearer 原样送至独立服务且不缓存私有结果。
    location = /mcp {
        client_max_body_size 64k;
        proxy_pass http://mcp:3010/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Android SDK 上报接口支持大请求，关闭 Nginx 请求体缓冲避免额外占用磁盘。
    location ^~ /ingest/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vue Router history fallback，直接访问子路由时仍返回 SPA 入口。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
