server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 内存泄漏报告 multipart 请求最大约 260 MiB；小于该值的请求也会受后端业务限制。
    client_max_body_size 260m;
    client_body_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Compose 健康检查入口，不对外暴露数据库或 ClickHouse。
    location = /healthz {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard 管理 API 使用同源 Session Cookie 和 CSRF Cookie。
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Android SDK 上报接口支持大请求，关闭 Nginx 请求体缓冲避免额外占用磁盘。
    location ^~ /ingest/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vue Router history fallback，直接访问子路由时仍返回 SPA 入口。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
